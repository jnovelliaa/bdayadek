<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday Adek!</title>
  <style>
    :root {
      --bg-color: #1783d6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 430px;
      max-height: 932px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: max-width 0.3s ease;
    }
    body.device-tab .app-container {
      max-width: 850px;
      max-height: 1100px;
    }
    .screen-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center center;
      display: none;
    }
    .screen-frame.active {
      display: block;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      z-index: 10;
    }

    /* STEP 0 MURNI HTML & CSS (TANPA 0.PNG) */
    #page0 {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    #page0.hidden {
      display: none;
    }
    .step0-title {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 32px;
    }
    .step0-btn {
      display: block;
      width: 80%;
      max-width: 280px;
      padding: 14px 18px;
      margin: 10px 0;
      background-color: #ffd54f;
      color: #000;
      border: 3px solid #000;
      border-radius: 50px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
      transition: transform 0.1s ease;
    }
    .step0-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    /* MODAL MUSIK FROSTED GLASS BLUR */
    #music-modal {
      position: fixed;
      inset: 0;
      background: rgba(23, 131, 214, 0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #ffffff;
      border: 3px solid #000;
      border-radius: 24px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 6px 6px 0px #000;
    }
    .modal-title {
      font-size: 17px;
      font-weight: bold;
      color: #222;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .modal-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      border: 2.5px solid #000;
      border-radius: 50px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
      transition: transform 0.1s ease;
    }
    .modal-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }
    .btn-play { background-color: #ffd54f; color: #000; }
    .btn-skip { background-color: #e0e0e0; color: #444; }

    /* HOTSPOT POSITIONING (RASIO 4:3) */
    #page1 .btn-malas { top: 72.5%; left: 16%; width: 29.5%; height: 12.5%; }
    #page1 .btn-mau   { top: 73%; left: 56%; width: 26%; height: 13%; }

    #page2 .btn-pencet { top: 83.5%; left: 37.5%; width: 25%; height: 7.5%; }
    #page3 .btn-pencet { top: 83.5%; left: 37.5%; width: 25%; height: 7.5%; }

    #page4 .btn-ndamayah   { top: 82.3%; left: 20%; width: 56.5%; height: 5.9%; }
    #page4 .btn-mayahdikit { top: 90.2%; left: 27.5%; width: 41.5%; height: 5.9%; }

    #page5 .btn-memaafkan { top: 81.5%; left: 15.5%; width: 69%; height: 12%; }

    #page6 .btn-gdrive1 { top: 39.6%; left: 33.8%; width: 32.5%; height: 6.2%; }
    #page6 .btn-gdrive2 { top: 54.2%; left: 33.8%; width: 32.5%; height: 6.2%; }
  </style>
</head>
<body class="device-hp">

  <audio id="bg-music" src="/audio/negoro_angin.mp3" loop preload="auto"></audio>

  <div id="music-modal">
    <div class="modal-box">
      <div class="modal-title">PUTAR LAGU BACKGROUND DULU BIAR LEBIH SERU? 🎵</div>
      <button class="modal-btn btn-play" onclick="startAudio(true)">PLAY LAGUNYA KAKAK! 🎵</button>
      <button class="modal-btn btn-skip" onclick="startAudio(false)">TANPA LAGU AJA</button>
    </div>
  </div>

  <div class="app-container">

    <!-- STEP 0 MURNI HTML -->
    <div id="page0">
      <div class="step0-title">COBA DIPILIH DULU, SAYANG</div>
      <button class="step0-btn" onclick="selectDevice('hp')">ADEK PAKE HP, KAKAK</button>
      <button class="step0-btn" onclick="selectDevice('tab')">ADEK LAGI PAKE TAB NIH</button>
    </div>

    <!-- HALAMAN 1 -->
    <div id="page1" class="screen-frame" style="background-image: url('/img/1.png');">
      <button class="hotspot btn-malas" onclick="goToPage(2)"></button>
      <button class="hotspot btn-mau" onclick="goToPage(3)"></button>
    </div>

    <!-- HALAMAN 2 -->
    <div id="page2" class="screen-frame" style="background-image: url('/img/2.png');">
      <button class="hotspot btn-pencet" onclick="goToPage(3)"></button>
    </div>

    <!-- HALAMAN 3 -->
    <div id="page3" class="screen-frame" style="background-image: url('/img/3.png');">
      <button class="hotspot btn-pencet" onclick="goToPage(4)"></button>
    </div>

    <!-- HALAMAN 4 -->
    <div id="page4" class="screen-frame" style="background-image: url('/img/4.png');">
      <button class="hotspot btn-ndamayah" onclick="goToPage(6)"></button>
      <button class="hotspot btn-mayahdikit" onclick="goToPage(5)"></button>
    </div>

    <!-- HALAMAN 5 -->
    <div id="page5" class="screen-frame" style="background-image: url('/img/5.png');">
      <button class="hotspot btn-memaafkan" onclick="goToPage(6)"></button>
    </div>

    <!-- HALAMAN 6 (GOOGLE DRIVE LINK ASLI) -->
    <div id="page6" class="screen-frame" style="background-image: url('/img/6.png');">
      <a href="https://drive.google.com/drive/folders/1_PN-Xi_RWbo-cuSS_zfpHCnuo1qzyN_2?usp=sharing" target="_blank" class="hotspot btn-gdrive1" onclick="stopMusic()"></a>
      <a href="https://drive.google.com/drive/folders/1-dm9uASgmMd1zciWeeZOMahYOQ0AjUso?usp=drive_link" target="_blank" class="hotspot btn-gdrive2" onclick="stopMusic()"></a>
    </div>

  </div>

  <script>
    const audio = document.getElementById('bg-music');

    function selectDevice(type) {
      if (type === 'tab') {
        document.body.classList.remove('device-hp');
        document.body.classList.add('device-tab');
      } else {
        document.body.classList.remove('device-tab');
        document.body.classList.add('device-hp');
      }
      
      document.getElementById('page0').classList.add('hidden');
      document.getElementById('music-modal').style.display = 'flex';
    }

    function startAudio(play) {
      document.getElementById('music-modal').style.display = 'none';
      if (play) {
        audio.play().catch(e => console.log("Audio play blocked", e));
      }
      goToPage(1);
    }

    function stopMusic() {
      audio.pause();
      audio.currentTime = 0;
    }

    function goToPage(pageNumber) {
      const screens = document.querySelectorAll('.screen-frame');
      screens.forEach(s => s.classList.remove('active'));

      const target = document.getElementById('page' + pageNumber);
      if (target) {
        target.classList.add('active');
      }
    }
  </script>
</body>
</html>
